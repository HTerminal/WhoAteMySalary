# Build & publish WhoAteMySalary desktop binaries.
#
# Triggers on any pushed tag shaped like v1.2.3 (and on manual dispatch so you
# can test the pipeline without cutting a real tag).
#
# Flow:
#   1. `build`   - matrix over Windows / macOS / Linux; runs PyInstaller against
#                  WhoAteMySalary.spec and uploads a per-OS archive artifact.
#   2. `release` - downloads every artifact, pulls this version's notes out of
#                  CHANGELOG.md, and creates a GitHub Release with the archives
#                  attached.
#
# The bundled Google OAuth "Desktop app" client (optional) is injected at build
# time from repo secrets MMT_GOOGLE_CLIENT_ID / MMT_GOOGLE_CLIENT_SECRET. If the
# secrets are unset the env vars are simply empty and the build still succeeds -
# users just paste their own client in Settings -> "Google sign-in setup".

name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

# Needed so the final job can create a GitHub Release.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the whole matrix if one OS fails - we still learn from the others.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        # The MMT_* vars bake default OAuth client(s) into the shipped app when the
        # maintainer has set the matching repo secrets; empty otherwise (harmless).
        env:
          MMT_GOOGLE_CLIENT_ID: ${{ secrets.MMT_GOOGLE_CLIENT_ID }}
          MMT_GOOGLE_CLIENT_SECRET: ${{ secrets.MMT_GOOGLE_CLIENT_SECRET }}
          MMT_MICROSOFT_CLIENT_ID: ${{ secrets.MMT_MICROSOFT_CLIENT_ID }}
          MMT_MICROSOFT_CLIENT_SECRET: ${{ secrets.MMT_MICROSOFT_CLIENT_SECRET }}
        run: pyinstaller WhoAteMySalary.spec

      # ---- Package the one-folder output per OS -----------------------------
      # PyInstaller writes to dist/WhoAteMySalary (and dist/WhoAteMySalary.app
      # on macOS). We compress that into a single archive named after the OS.

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/WhoAteMySalary/* `
            -DestinationPath WhoAteMySalary-windows.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          # Prefer the .app bundle if the spec produced one; fall back to the folder.
          if [ -d "WhoAteMySalary.app" ]; then
            zip -r -y ../WhoAteMySalary-macos.zip WhoAteMySalary.app
          else
            zip -r ../WhoAteMySalary-macos.zip WhoAteMySalary
          fi

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf WhoAteMySalary-linux.tar.gz -C dist WhoAteMySalary

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhoAteMySalary-${{ runner.os }}
          path: |
            WhoAteMySalary-windows.zip
            WhoAteMySalary-macos.zip
            WhoAteMySalary-linux.tar.gz
          # Only one of the three exists per runner; ignore the missing ones.
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only publish for real tag pushes, not manual dispatch test runs.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        # download-artifact nests each artifact in its own folder; collect the
        # archives into a single dist/ directory for the release step.
        run: |
          mkdir -p dist
          find artifacts -type f \
            \( -name '*.zip' -o -name '*.tar.gz' \) \
            -exec cp {} dist/ \;
          echo "Collected release assets:"
          ls -la dist

      - name: Extract changelog notes for this tag
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          # refs/tags/v1.1.0 -> 1.1.0
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "Looking for changelog section for version: ${version}"

          # Pull the block between "## [<version>]" and the next "## [" heading.
          notes="$(awk -v ver="$version" '
            # Match the heading for our version, e.g. "## [1.1.0]" or "## [1.1.0] - 2026-07-13"
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            # Any subsequent "## [" heading ends our section.
            grab && /^## \[/        { grab = 0 }
            grab                    { print }
          ' CHANGELOG.md)"

          # Trim leading/trailing blank lines.
          notes="$(printf '%s\n' "$notes" | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac)"

          if [ -z "$notes" ]; then
            notes="Release ${tag}. See CHANGELOG.md for details."
          fi

          # Emit as a multi-line output using a random heredoc delimiter.
          delim="EOF_$(date +%s%N)"
          {
            echo "body<<${delim}"
            echo "$notes"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            dist/*.zip
            dist/*.tar.gz
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
